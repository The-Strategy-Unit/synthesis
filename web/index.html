<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synthesis</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="importmap">
    {
      "imports": {
        "d3-force": "https://esm.sh/d3-force@3",
        "d3-selection": "https://esm.sh/d3-selection@3",
        "d3-drag": "https://esm.sh/d3-drag@3",
        "d3-zoom": "https://esm.sh/d3-zoom@3"
      }
    }
    </script>
  </head>
  <body>
    <div id="app">
      <!-- Top bar -->
      <header id="topbar">
        <span class="logo">Synthesis</span>
        <div class="search-box">
          <input type="text" id="search-input"
            placeholder="Search your knowledge base..." />
          <select id="search-mode">
            <option value="semantic">Semantic</option>
            <option value="keyword">Keyword</option>
          </select>
        </div>
      </header>

      <!-- Three-panel layout -->
      <main id="main">
        <aside id="sidebar">
          <h3>Notes</h3>
          <ul id="note-list"></ul>
        </aside>
        <section id="graph-panel">
          <svg id="graph"></svg>
        </section>
      </main>

      <!-- Note modal -->
      <div id="note-modal" class="modal hidden">
        <div class="modal-content">
          <button id="modal-close">&times;</button>
          <div id="note-content"></div>
        </div>
      </div>

      <!-- Graph panel -->
      <aside id="graph-panel">
        <h3>Connections</h3>
        <div class="threshold-control">
          <label>Min similarity: <span id="threshold-value">0.55</span></label>
          <input type="range" id="similarity-slider" min="0" max="1" step="0.05"
            value="0.55" />
        </div>
        <svg id="graph"></svg>
      </aside>
      </main>

      <!-- Ingest bar -->
      <footer id="ingest-bar">
        <input type="text" id="ingest-input"
          placeholder="Paste a YouTube URL or text..." />
        <button id="ingest-btn">Ingest</button>
        <span id="ingest-status"></span>
      </footer>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
