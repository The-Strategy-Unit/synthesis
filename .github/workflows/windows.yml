name: Windows

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint
      - run: deno task check
      - run: deno task test:unit
      - run: deno task test:integration
      - run: deno task test:e2e
      - run: deno task test:browser
      - run: deno task compile:windows
      - run: deno task test:compiled dist/synthesis-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: synthesis-windows-x86_64
          path: dist/synthesis-windows-x86_64.exe
          if-no-files-found: error
