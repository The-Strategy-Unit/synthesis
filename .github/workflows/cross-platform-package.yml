name: Cross-platform packaging

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test-and-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: deno lint
      - run: deno task check
      - run: deno task test:unit
      - run: deno task test:integration
      - run: deno task test:e2e
      - name: Test browser interactions
        run: deno task test:browser
        timeout-minutes: 2
      - run: deno task compile:windows
      - run: deno task test:compiled dist/synthesis-windows-x86_64.exe
      - name: Package release archive
        shell: pwsh
        run: |
          $version = (Get-Content "deno.json" -Raw | ConvertFrom-Json).version
          $name = "synthesis-v$version-windows-x86_64"
          $package = Join-Path "dist/release" $name
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item "dist/synthesis-windows-x86_64.exe" (Join-Path $package "$name.exe")
          Copy-Item "LICENSE" $package
          Copy-Item "demos/haca-2025-vault" "$package/haca-2025-vault" -Recurse
          Compress-Archive `
            -Path "$package/*" `
            -DestinationPath (Join-Path "dist" "$name.zip") `
            -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: synthesis-windows-x86_64
          path: dist/synthesis-v*-windows-x86_64.zip
          if-no-files-found: error

  linux-compiled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: deno task compile:linux
      - run: deno task test:compiled dist/synthesis-linux-x86_64
      - name: Package release archive
        run: |
          version="$(deno eval --allow-read=deno.json 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
          name="synthesis-v${version}-linux-x86_64"
          package="dist/release/$name"
          mkdir -p "$package"
          cp dist/synthesis-linux-x86_64 "$package/$name"
          cp LICENSE "$package/"
          cp -R demos/haca-2025-vault "$package/"
          chmod +x "$package/$name"
          tar -czf "dist/${name}.tar.gz" \
            -C "$package" "$name" LICENSE haca-2025-vault
      - uses: actions/upload-artifact@v4
        with:
          name: synthesis-linux-x86_64
          path: dist/synthesis-v*-linux-x86_64.tar.gz
          if-no-files-found: error

  macos-compiled:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - run: deno task compile:macos
      - run: deno task test:compiled dist/synthesis-macos-aarch64
      - name: Package release archive
        run: |
          version="$(deno eval --allow-read=deno.json 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
          name="synthesis-v${version}-macos-aarch64"
          package="dist/release/$name"
          mkdir -p "$package"
          cp dist/synthesis-macos-aarch64 "$package/$name"
          cp LICENSE "$package/"
          cp -R demos/haca-2025-vault "$package/"
          chmod +x "$package/$name"
          tar -czf "dist/${name}.tar.gz" \
            -C "$package" "$name" LICENSE haca-2025-vault
      - uses: actions/upload-artifact@v4
        with:
          name: synthesis-macos-aarch64
          path: dist/synthesis-v*-macos-aarch64.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows-test-and-compile
      - linux-compiled
      - macos-compiled
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          version="$(jq -r '.version' deno.json)"
          expected="v${version}"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME must match deno.json version $expected"
            exit 1
          fi

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: synthesis-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          prefix="synthesis-${GITHUB_REF_NAME}"
          sha256sum \
            "${prefix}-linux-x86_64.tar.gz" \
            "${prefix}-macos-aarch64.tar.gz" \
            "${prefix}-windows-x86_64.zip" \
            > SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="synthesis-${GITHUB_REF_NAME}"
          expected_assets="$(printf '%s\n' \
            SHA256SUMS \
            "${prefix}-linux-x86_64.tar.gz" \
            "${prefix}-macos-aarch64.tar.gz" \
            "${prefix}-windows-x86_64.zip" | sort)"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            actual_assets="$(gh release view "$GITHUB_REF_NAME" \
              --json assets --jq '.assets[].name' | sort)"
            if [[ "$actual_assets" != "$expected_assets" ]]; then
              echo "::error::Release $GITHUB_REF_NAME already exists with unexpected assets; refusing to overwrite it"
              exit 1
            fi
            echo "Release $GITHUB_REF_NAME already has the expected assets."
            exit 0
          fi

          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            "release-assets/${prefix}-linux-x86_64.tar.gz" \
            "release-assets/${prefix}-macos-aarch64.tar.gz" \
            "release-assets/${prefix}-windows-x86_64.zip" \
            release-assets/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --fail-on-no-commits \
            --title "Synthesis $GITHUB_REF_NAME" \
            "${prerelease[@]}"
